[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[project]
name = "lab01-calc"
version = "0.1.0"
description = "CLI calculator and unit converter"
requires-python = ">=3.12"

dependencies = [
    "pytest>=8.4.2",
]


[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.16.10",
]
